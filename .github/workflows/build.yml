name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        numpy-version: [latest]
        include:
          - python-version: "3.10"
            numpy-version: "1.21.6"
          - python-version: "3.12"
            numpy-version: "1.26.4"
          - python-version: "3.13"
            numpy-version: "2.2.6"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Install compatibility NumPy version
        if: matrix.numpy-version != 'latest'
        env:
          NUMPY_VERSION: ${{ matrix.numpy-version }}
        run: python -m pip install "numpy==$NUMPY_VERSION"
      - name: Lint source and tests
        run: python -m flake8 prefsampling tests validation --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test with coverage
        run: python -m coverage run --source=prefsampling -m unittest
      - name: Coverage report
        run: python -m coverage report
