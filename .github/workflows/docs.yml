name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ".[docs]"
      - run: python -m sphinx -b html docs-source/source docs-source/build/html
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs-source/build/html
