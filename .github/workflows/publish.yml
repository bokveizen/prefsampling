name: Build distributions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke test installed wheel outside checkout
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -c "import prefsampling; from prefsampling.ordinal import impartial; print(prefsampling.__version__); assert len(impartial(3, 4, seed=42)) == 3"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
