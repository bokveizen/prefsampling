[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "prefsampling"
version = "0.1.25.dev0"
description = "Algorithms to sample preferences of all kinds."
authors = [
  { name = "Simon Rey", email = "reysimon@orange.fr" },
  { name = "Stanisław Szufa", email = "s.szufa@gmail.com" },
]
license = { file = "LICENSE.md" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.6",
]

[project.optional-dependencies]
test = ["coverage", "flake8"]
docs = ["Sphinx>=7", "sphinx-book-theme"]
validation = ["matplotlib", "pandas", "seaborn", "scipy"]
dev = [
    "coverage",
    "flake8",
    "build",
    "Sphinx>=7",
    "sphinx-book-theme",
    "matplotlib",
    "pandas",
    "seaborn",
    "scipy"
]

[project.urls]
"Homepage" = "https://github.com/bokveizen/prefsampling"
"Bug Tracker" = "https://github.com/bokveizen/prefsampling/issues"
"Upstream" = "https://github.com/COMSOC-Community/prefsampling"
